```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Enquiry - Contact Us</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
        }

        .contact-box {
            display: flex;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        /* Left Section */
        .contact-info {
            width: 40%;
            background: #2563eb;
            color: white;
            padding: 40px;
        }

        .contact-info h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .contact-info p {
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .info {
            margin-bottom: 25px;
        }

        .info h3 {
            margin-bottom: 8px;
        }

        /* Right Section */
        .contact-form {
            width: 60%;
            padding: 40px;
        }

        .contact-form h2 {
            margin-bottom: 25px;
            font-size: 28px;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .contact-box {
                flex-direction: column;
            }

            .contact-info,
            .contact-form {
                width: 100%;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="contact-box">

            <!-- Contact Information -->
            <div class="contact-info">

                <h1>Contact Us</h1>

                <p>
                    Have a question about our products?
                    Fill out the enquiry form and our team
                    will get back to you shortly.
                </p>

                <div class="info">
                    <h3>📧 Email</h3>
                    <p>support@example.com</p>
                </div>

                <div class="info">
                    <h3>📞 Phone</h3>
                    <p>+91 98765 43210</p>
                </div>

                <div class="info">
                    <h3>📍 Address</h3>
                    <p>
                        New Delhi, India
                    </p>
                </div>

            </div>


            <!-- Product Enquiry Form -->
            <div class="contact-form">

                <h2>Product Enquiry</h2>

                <form>

                    <div class="row">

                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input
                                type="text"
                                id="name"
                                placeholder="Enter your name"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email"
                                required
                            >
                        </div>

                    </div>


                    <div class="row">

                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input
                                type="tel"
                                id="phone"
                                placeholder="Enter phone number"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="product">Select Product</label>

                            <select id="product" required>
                                <option value="">Choose a product</option>
                                <option>Laptop</option>
                                <option>Smartphone</option>
                                <option>Headphones</option>
                                <option>Smart Watch</option>
                                <option>Other</option>
                            </select>
                        </div>

                    </div>


                    <div class="form-group">
                        <label for="quantity">Quantity</label>

                        <input
                            type="number"
                            id="quantity"
                            min="1"
                            placeholder="Enter required quantity"
                        >
                    </div>


                    <div class="form-group">
                        <label for="message">Your Enquiry</label>

                        <textarea
                            id="message"
                            placeholder="Write your product enquiry..."
                            required
                        ></textarea>
                    </div>


                    <button type="submit">
                        Send Enquiry
                    </button>

                </form>

            </div>

        </div>

    </div>

</body>
</html>
```
